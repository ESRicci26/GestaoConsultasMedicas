<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecalho('Pacientes')}"></head>
<body>
<header th:replace="~{fragmentos/base :: navegacao}"></header>

<main class="container">
    <div th:replace="~{fragmentos/base :: mensagens}"></div>

    <div class="cabecalho-pagina">
        <h1>Pacientes</h1>
        <div class="acoes">
            <a class="botao" th:href="@{/admin/pacientes/novo}">Cadastrar paciente</a>
            <a class="botao botao--contorno" th:href="@{/admin/menu}">Voltar</a>
        </div>
    </div>

    <div class="vazio" th:if="${#lists.isEmpty(pacientes)}">Nenhum paciente cadastrado.</div>

    <div class="tabela-responsiva" th:if="${!#lists.isEmpty(pacientes)}">
        <table class="tabela">
            <thead><tr><th>CPF</th><th>Nome</th><th>Idade</th><th>Plano</th><th></th></tr></thead>
            <tbody>
            <tr th:each="paciente : ${pacientes}">
                <td data-rotulo="CPF" th:text="${paciente.cpf}">00000000000</td>
                <td data-rotulo="Nome" th:text="${paciente.nome}">Nome</td>
                <td data-rotulo="Idade" th:text="${paciente.idade}">30</td>
                <td data-rotulo="Plano" th:text="${paciente.plano != null} ? ${paciente.plano} : 'Particular'">Plano</td>
                <td>
                    <form th:action="@{|/admin/pacientes/${paciente.cpf}/excluir|}" method="post"
                          onsubmit="return confirm('Excluir este paciente?');">
                        <button type="submit" class="botao botao--perigo botao--pequeno">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragmentos/base :: rodape}"></footer>
</body>
</html>
