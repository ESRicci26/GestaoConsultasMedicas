<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecalho('Cancelar consulta')}"></head>
<body>
<header th:replace="~{fragmentos/base :: navegacao}"></header>

<main class="container">
    <div th:replace="~{fragmentos/base :: mensagens}"></div>

    <div class="cabecalho-pagina">
        <h1>Cancelar consulta</h1>
        <a class="botao botao--contorno" th:href="@{/paciente/menu}">Voltar</a>
    </div>

    <div class="vazio" th:if="${#lists.isEmpty(consultas)}">Você não possui consultas pendentes.</div>

    <div class="tabela-responsiva" th:if="${!#lists.isEmpty(consultas)}">
        <table class="tabela">
            <thead><tr><th>Nº</th><th>Data</th><th>Médico</th><th></th></tr></thead>
            <tbody>
            <tr th:each="consulta : ${consultas}">
                <td data-rotulo="Nº" th:text="${consulta.id}">1</td>
                <td data-rotulo="Data" th:text="${#temporals.format(consulta.dataConsulta, 'dd/MM/yyyy')}">01/01/2026</td>
                <td data-rotulo="Médico" th:text="${consulta.nomeMedico} + ' (CRM ' + ${consulta.crmMedico} + ')'">Médico</td>
                <td>
                    <form th:action="@{|/paciente/consultas/${consulta.id}/cancelar|}" method="post"
                          onsubmit="return confirm('Deseja realmente desmarcar esta consulta?');">
                        <button type="submit" class="botao botao--perigo botao--pequeno">Desmarcar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragmentos/base :: rodape}"></footer>
</body>
</html>
