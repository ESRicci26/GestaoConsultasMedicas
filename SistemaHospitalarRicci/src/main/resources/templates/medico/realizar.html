<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecalho('Realização de consulta')}"></head>
<body>
<header th:replace="~{fragmentos/base :: navegacao}"></header>

<main class="container">
    <div th:replace="~{fragmentos/base :: mensagens}"></div>

    <div class="cartao-conteudo cartao-conteudo--medio">
        <h1>Realização de consulta</h1>

        <div class="dados-consulta">
            <span><strong>Paciente:</strong> <span th:text="${consulta.nomePaciente}">Paciente</span></span>
            <span><strong>Data:</strong> <span th:text="${#temporals.format(consulta.dataConsulta, 'dd/MM/yyyy')}">01/01/2026</span></span>
            <span><strong>Plano:</strong> <span th:text="${consulta.pacienteTemPlano()} ? ${consulta.planoPaciente} : 'Particular (consulta cobrada)'">Plano</span></span>
        </div>

        <form class="formulario" th:object="${formulario}" th:action="@{|/medico/consultas/${consulta.id}/realizar|}"
              method="post" novalidate>
            <div th:replace="~{fragmentos/base :: errosGlobais}"></div>

            <div class="campo">
                <label for="sintomas">Sintomas</label>
                <textarea id="sintomas" th:field="*{sintomas}" required></textarea>
                <small class="erro" th:if="${#fields.hasErrors('sintomas')}" th:errors="*{sintomas}"></small>
            </div>
            <div class="campo">
                <label for="tratamento">Tratamento</label>
                <textarea id="tratamento" th:field="*{tratamento}" required></textarea>
                <small class="erro" th:if="${#fields.hasErrors('tratamento')}" th:errors="*{tratamento}"></small>
            </div>
            <div class="linha-campos">
                <div class="campo">
                    <label for="medicamentos">Medicamentos</label>
                    <textarea id="medicamentos" th:field="*{medicamentos}"></textarea>
                    <small class="erro" th:if="${#fields.hasErrors('medicamentos')}" th:errors="*{medicamentos}"></small>
                </div>
                <div class="campo">
                    <label for="exames">Exames</label>
                    <textarea id="exames" th:field="*{exames}"></textarea>
                    <small class="erro" th:if="${#fields.hasErrors('exames')}" th:errors="*{exames}"></small>
                </div>
            </div>

            <div class="campo" th:unless="${consulta.pacienteTemPlano()}">
                <label for="valor">Valor a pagar (R$)</label>
                <input id="valor" type="number" min="0" step="0.01" th:field="*{valor}" required>
                <small class="ajuda">O paciente não possui plano de saúde, portanto a consulta é cobrada.</small>
                <small class="erro" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></small>
            </div>

            <div class="acoes">
                <button type="submit" class="botao">Finalizar consulta</button>
                <a class="botao botao--contorno" th:href="@{/medico/consultas}">Voltar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragmentos/base :: rodape}"></footer>
</body>
</html>
