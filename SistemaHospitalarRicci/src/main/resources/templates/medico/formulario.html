<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecalho(${pagina.titulo})}"></head>
<body>
<header th:replace="~{fragmentos/base :: navegacao}"></header>

<main class="container">
    <div th:replace="~{fragmentos/base :: mensagens}"></div>

    <div class="cartao-conteudo cartao-conteudo--medio">
        <h1 th:text="${pagina.titulo}">Médico</h1>

        <form class="formulario" th:object="${formulario}" th:action="@{${pagina.acao}}" method="post" novalidate>
            <div th:replace="~{fragmentos/base :: errosGlobais}"></div>

            <div class="linha-campos">
                <div class="campo">
                    <label for="crm">CRM</label>
                    <input id="crm" type="text" maxlength="20" th:field="*{crm}" th:readonly="${pagina.edicao}" required>
                    <small class="erro" th:if="${#fields.hasErrors('crm')}" th:errors="*{crm}"></small>
                </div>
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input id="nome" type="text" maxlength="120" th:field="*{nome}" required>
                    <small class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
                </div>
            </div>

            <div class="linha-campos">
                <div class="campo">
                    <label for="especialidade">Especialidade</label>
                    <input id="especialidade" type="text" maxlength="80" th:field="*{especialidade}" required>
                    <small class="erro" th:if="${#fields.hasErrors('especialidade')}" th:errors="*{especialidade}"></small>
                </div>
                <div class="campo">
                    <label for="planoAtendido">Plano atendido</label>
                    <input id="planoAtendido" type="text" maxlength="80" th:field="*{planoAtendido}">
                    <small class="ajuda">Pacientes com plano só enxergam médicos que atendem o mesmo plano.</small>
                    <small class="erro" th:if="${#fields.hasErrors('planoAtendido')}" th:errors="*{planoAtendido}"></small>
                </div>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input id="senha" type="password" name="senha" minlength="6" maxlength="72"
                       autocomplete="new-password" th:required="${!pagina.edicao}">
                <small class="ajuda" th:if="${pagina.edicao}">Deixe em branco para manter a senha atual.</small>
                <small class="erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></small>
            </div>

            <div class="acoes">
                <button type="submit" class="botao" th:text="${pagina.edicao} ? 'Salvar alterações' : 'Cadastrar'">Salvar</button>
                <a class="botao botao--contorno" th:href="@{${pagina.urlVoltar}}">Voltar</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragmentos/base :: rodape}"></footer>
</body>
</html>
