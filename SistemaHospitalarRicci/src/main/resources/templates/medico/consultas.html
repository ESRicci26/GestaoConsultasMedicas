<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecalho('Realizar consulta')}"></head>
<body>
<header th:replace="~{fragmentos/base :: navegacao}"></header>

<main class="container">
    <div th:replace="~{fragmentos/base :: mensagens}"></div>

    <div class="cabecalho-pagina">
        <h1>Realizar consulta</h1>
        <a class="botao botao--contorno" th:href="@{/medico/menu}">Voltar</a>
    </div>

    <div class="vazio" th:if="${#lists.isEmpty(consultas)}">Não há consultas agendadas para você.</div>

    <div class="tabela-responsiva" th:if="${!#lists.isEmpty(consultas)}">
        <table class="tabela">
            <thead><tr><th>Nº</th><th>Data</th><th>Paciente</th><th>CPF</th><th></th></tr></thead>
            <tbody>
            <tr th:each="consulta : ${consultas}">
                <td data-rotulo="Nº" th:text="${consulta.id}">1</td>
                <td data-rotulo="Data" th:text="${#temporals.format(consulta.dataConsulta, 'dd/MM/yyyy')}">01/01/2026</td>
                <td data-rotulo="Paciente" th:text="${consulta.nomePaciente}">Paciente</td>
                <td data-rotulo="CPF" th:text="${consulta.cpfPaciente}">00000000000</td>
                <td><a class="botao botao--pequeno" th:href="@{|/medico/consultas/${consulta.id}/realizar|}">Atender</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragmentos/base :: rodape}"></footer>
</body>
</html>
