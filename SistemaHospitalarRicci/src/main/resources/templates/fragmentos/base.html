<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- Cabeçalho comum: metadados, título da página e folha de estilos -->
<head th:fragment="cabecalho(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Sistema Hospitalar Ricci'">Sistema Hospitalar Ricci</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>

<!-- Barra de navegação: o menu aparece apenas com usuário autenticado -->
<header class="topo" th:fragment="navegacao">
    <div class="topo__conteudo">
        <a class="marca" th:href="@{/}">✚ Sistema Hospitalar Ricci</a>
        <th:block th:if="${usuarioAtual != null}">
            <input type="checkbox" id="alternar-menu" class="topo__alternador">
            <label for="alternar-menu" class="topo__botao" aria-label="Abrir ou fechar o menu">☰</label>
            <nav class="topo__menu">
                <span class="topo__usuario" th:text="${usuarioAtual.nome}">Usuário</span>
                <a th:href="@{|${usuarioAtual.tipo.caminhoBase}/menu|}">Menu</a>
                <form th:action="@{/sair}" method="post">
                    <button type="submit" class="botao botao--contorno">Sair</button>
                </form>
            </nav>
        </th:block>
    </div>
</header>

<!-- Mensagens de sucesso, aviso e erro (flash ou do modelo) -->
<div th:fragment="mensagens">
    <div class="alerta alerta--sucesso" role="status" th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></div>
    <div class="alerta alerta--aviso" role="status" th:if="${mensagemAviso}" th:text="${mensagemAviso}"></div>
    <div class="alerta alerta--erro" role="alert" th:if="${mensagemErro}" th:text="${mensagemErro}"></div>
</div>

<!-- Erros globais do formulário (regras de negócio); usar dentro de th:object -->
<div th:fragment="errosGlobais">
    <div class="alerta alerta--erro" role="alert" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></p>
    </div>
</div>

<!-- Rodapé -->
<footer class="rodape" th:fragment="rodape">
    Sistema Hospitalar Ricci &middot; Cuidando da sua saúde
</footer>

</body>
</html>
