<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecalho('Erro')}"></head>
<body>
<header th:replace="~{fragmentos/base :: navegacao}"></header>

<main class="container">
    <div class="cartao-conteudo cartao-conteudo--estreito">
        <h1>Ops! Algo não saiu como esperado</h1>
        <div class="alerta alerta--erro" role="alert"
             th:text="${mensagem != null} ? ${mensagem} : 'Página não encontrada ou erro inesperado.'"></div>
        <a class="botao" th:href="@{/}">Voltar ao início</a>
    </div>
</main>

<footer th:replace="~{fragmentos/base :: rodape}"></footer>
</body>
</html>
