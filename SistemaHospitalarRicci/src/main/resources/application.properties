spring.application.name=SistemaHospitalarRicci
server.port=8080

# =========================================================
# Banco de Dados PostgreSQL Localmente
# =========================================================
spring.datasource.url=${BANCO_URL:jdbc:postgresql://localhost:5432/hospital}
spring.datasource.username=${BANCO_USUARIO:postgres}
spring.datasource.password=${BANCO_SENHA:12345678}

# =========================================================
# Banco de Dados PostgreSQL - HOSTINGER
# =========================================================
#spring.datasource.url= jdbc:postgresql://99.99.9.999:5432/hospital
#spring.datasource.username=postgres
#spring.datasource.password=12345678

# Thymeleaf
spring.thymeleaf.cache=false
spring.web.locale=pt_BR

# Regras do hospital
hospital.agenda.limite-diario-por-medico=4
hospital.administrador.usuario=${ADMIN_USUARIO:admin}
hospital.administrador.senha=${ADMIN_SENHA:admin123}


