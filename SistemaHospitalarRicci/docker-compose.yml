services:
  banco:
    image: postgres:16
    container_name: hospital-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./banco/02_criar_tabelas.sql:/docker-entrypoint-initdb.d/02_criar_tabelas.sql:ro
      - ./banco/03_dados_exemplo.sql:/docker-entrypoint-initdb.d/03_dados_exemplo.sql:ro

volumes:
  dados_postgres:
